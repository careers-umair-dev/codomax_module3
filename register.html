<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Quill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 10h14M9 16h14M9 22h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      Quill
    </a>
    <nav id="navLinks" class="nav-links" aria-label="Primary">
      <a href="index.html" class="nav-link">Home</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="create-blog.html" class="nav-link">Write a post</a>
    </nav>
    <div class="nav-actions">
      <div id="navAuthSlot" class="nav-actions"></div>
      <button id="navToggle" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="auth-shell">
  <div class="auth-card card">
    <div class="brand-mark" style="width:44px;height:44px;">
      <svg viewBox="0 0 32 32" fill="none" style="width:100%;height:100%;"><path d="M9 10h14M9 16h14M9 22h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div class="auth-header">
      <h1>Create your account</h1>
      <p>Join Quill to start writing posts.</p>
    </div>

    <div id="registerBanner" class="banner"></div>

    <form id="registerForm" novalidate>
      <div class="field" id="registerNameField">
        <label for="registerName">Full name</label>
        <input type="text" id="registerName" name="name" placeholder="Jane Doe" autocomplete="name">
        <span class="error-msg"></span>
      </div>

      <div class="field" id="registerEmailField">
        <label for="registerEmail">Email address</label>
        <input type="email" id="registerEmail" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="error-msg"></span>
      </div>

      <div class="field" id="registerPasswordField">
        <label for="registerPassword">Password</label>
        <div class="password-field">
          <input type="password" id="registerPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password">
          <button type="button" class="password-toggle">Show</button>
        </div>
        <div class="password-strength" id="passwordStrength"><span></span><span></span><span></span></div>
        <span class="error-msg"></span>
      </div>

      <div class="field" id="registerConfirmField">
        <label for="registerConfirm">Confirm password</label>
        <div class="password-field">
          <input type="password" id="registerConfirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="password-toggle">Show</button>
        </div>
        <span class="error-msg"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
